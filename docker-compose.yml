services:
  datoryx-operator:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATORYX_JWT_SECRET=${DATORYX_JWT_SECRET:-change-me-in-production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - datoryx-users:/app/backend/api
    restart: unless-stopped

volumes:
  datoryx-users:
